replicaCount: 2
image:
  repository: ghcr.io/kawahed21/portfolio-api
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
containerPort: 8000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
probes:
  readiness:
    path: /ready
  liveness:
    path: /health
