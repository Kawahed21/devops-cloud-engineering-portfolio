name: DevSecOps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform configuration
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: projects/01-terraform-aws-foundation
          framework: terraform
          soft_fail: false

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t portfolio-api:${{ github.sha }} projects/02-containerized-microservice
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio-api:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
